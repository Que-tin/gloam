name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Xcode 27, as Gloam is built locally: the macos-26 image tops out at Xcode 26.6, whose
    # compiler (Swift 6.3) crashes on the UI code.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app and disk image
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Gloam
          path: .build/Gloam.dmg
