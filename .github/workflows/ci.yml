name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  private-api:
    # The private API Gloam relies on, on every macOS GitHub still runs: a removal or a
    # changed signature shows here first (`scripts/check-private-api.swift`). A plain script, so
    # it runs on images whose Xcode can't build the app.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check private API
        run: swift scripts/diag-filter-notification.swift
